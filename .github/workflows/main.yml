name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble signed release
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD}"
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/rachunki-signing.XXXXXX")"
          trap 'rm -rf -- "$signing_dir"' EXIT
          export RELEASE_KEYSTORE_FILE="$signing_dir/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RELEASE_KEYSTORE_FILE"
          unset KEYSTORE_BASE64
          test -s "$RELEASE_KEYSTORE_FILE"
          # Use GitHub's monotonically increasing run number, independently of app versionName.
          version_code=$((GITHUB_RUN_NUMBER + 1))
          gradle --no-daemon --no-configuration-cache             "-PreleaseVersionCode=$version_code" assembleRelease

      - name: Verify release APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk" >/dev/null
          echo "Signed release APK verified."
          install -D "$apk" "$RUNNER_TEMP/rachunki-release/Rachunki-release.apk"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Rachunki-Release-APK
          path: ${{ runner.temp }}/rachunki-release/Rachunki-release.apk
          if-no-files-found: error
          retention-days: 14
